<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ChatNotice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="pair-view" class="view">
  <div class="pair-wrap">
    <div class="logo"></div>
    <h1>ChatNotice</h1>
    <p class="sub">连接电脑端的待办工作台</p>
    <div class="card">
      <label class="field">服务器地址
        <input id="pair-url" placeholder="http://192.168.1.10:8760" autocomplete="off" autocapitalize="off">
      </label>
      <label class="field">访问令牌
        <input id="pair-token" placeholder="在电脑端「手机配对」中复制" autocomplete="off" autocapitalize="off">
      </label>
      <button id="btn-connect" class="primary">连接</button>
      <p id="pair-err" class="err hidden"></p>
    </div>
    <p class="hint">手机和电脑需在同一 Wi-Fi；首次连接时请在电脑上允许防火墙访问。</p>
  </div>
</section>

<section id="main-view" class="view hidden">
  <header class="appbar">
    <div class="brand-row">
      <span class="dot"></span>
      <h1>待办</h1>
      <span id="sync-state" class="sync">已同步</span>
    </div>
    <div class="appbar-actions">
      <button id="btn-refresh" class="icon-btn" aria-label="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.16.4.4.75.72 1 .3.25.68.4 1.08.4H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.6z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs">
    <button data-view="active" class="active">待办 <span id="tab-active-count"></span></button>
    <button data-view="done">已完成 <span id="tab-done-count"></span></button>
  </nav>

  <main id="list" class="list"></main>

  <button id="btn-add" class="fab" aria-label="新建任务">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</section>

<div id="sheet-mask" class="mask hidden"></div>

<section id="sheet" class="sheet hidden">
  <div class="handle"></div>
  <div id="sheet-detail">
    <h2 id="s-title"></h2>
    <p id="s-note" class="s-note"></p>
    <p id="s-meta" class="s-meta"></p>
    <div class="sheet-actions">
      <button id="s-toggle" class="primary">完成</button>
      <button id="s-remove" class="danger">移除</button>
    </div>
  </div>
  <div id="sheet-add" class="hidden">
    <h2>新建任务</h2>
    <label class="field">标题<input id="a-title" placeholder="要做什么？" maxlength="300"></label>
    <label class="field">截止时间<input id="a-due" type="datetime-local"></label>
    <label class="field">说明<textarea id="a-note" rows="3" placeholder="可选"></textarea></label>
    <div class="sheet-actions">
      <button id="a-create" class="primary">创建</button>
      <button id="a-cancel" class="ghost">取消</button>
    </div>
  </div>
</section>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
